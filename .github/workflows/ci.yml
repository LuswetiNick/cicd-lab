name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/setup@v1
              with:
                  version: 12.9.1
                  runtime: node@24
                  cache: true
                  install: false
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run verification
              run: pnpm run verify
